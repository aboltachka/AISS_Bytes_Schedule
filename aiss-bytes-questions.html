<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AISS Bytes Questions</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script>
/* ======================================================================
   SETTINGS — the only part you need to edit.
   API_URL: the "Web app URL" of the QUESTIONS sheet's script (it ends in /exec).
   Use the questions sheet here, not the sign-up sheet.
   ====================================================================== */
var CONFIG = {
  API_URL: "https://script.google.com/macros/s/AKfycbzRdq_o471jq7xJHW4iNCf2zwKCIpA6NmZbifUIHrVivwmbbKdHZxnFE2ivCJwRB68q/exec",
  REFRESH_SECONDS: 6,   // how often the list checks for new questions
  CONTACT: ""           // optional footer line
};
</script>
<style>
/* Same visual system as the "Bits before Bytes" promo, the sign-up page and the
   schedule: a pale blue-grey sheet, heavy grotesque headlines, mono labels over
   thick rules, flat blue / navy / amber, square corners. Light only. */
:root {
  --bg: #F2F4F8;
  --surface: #FFFFFF;
  --ink: #111A33;
  --muted: #55607A;
  --line: #C9D0DF;
  --blue: #2343DD;
  --navy: #12227A;
  --amber: #F0A202;
  --tint: #E3E8FB;
  --err: #B42318;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; }
.wrap { max-width: 56rem; margin-inline: auto; padding-inline: clamp(16px, 4vw, 40px); padding-block: 1.5rem 4rem; display: flex; flex-direction: column; gap: 2.5rem; }
p, h1, h2, h3, ol, ul { margin: 0; }

.label { font-family: var(--mono); font-weight: 400; font-size: 0.6875rem; text-transform: uppercase; letter-spacing: 0.14em; color: var(--muted); }
.topline { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0.25rem 1.5rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--line); }

/* ---- hero: the seminar's name on one line, growing with the window ---- */
.mark { font-family: var(--display); font-weight: 800; font-size: clamp(2.75rem, 17vw, 9.75rem); line-height: 0.9; letter-spacing: -0.03em; }
.mark .b { color: var(--blue); }
.mark .w { white-space: nowrap; }
.mark .ch { display: inline-block; text-align: center; }
.mark .ch.bit { opacity: 0.28; }
.mark .ch.flip { color: var(--amber); }
.tagline { margin-top: 1.4rem; font-size: clamp(1.125rem, 2.4vw, 1.5rem); line-height: 1.35; }
.tagline strong { font-weight: 600; }

/* ---- ask box: the loudest element on the page ---- */
.ask { background: var(--surface); border: 2px solid var(--ink); padding: 1.1rem 1.25rem 1.3rem; display: flex; flex-direction: column; gap: 0.9rem; box-shadow: 6px 6px 0 var(--blue); margin-bottom: 0.4rem; }
.ask h2 { font-family: var(--display); font-weight: 700; font-size: 1.5rem; line-height: 1.15; }
.field { display: flex; flex-direction: column; gap: 0.35rem; min-width: 0; }
.field input, .field textarea { font: inherit; color: inherit; font-size: 1.0625rem; padding: 0.7rem 0.85rem; border: 2px solid var(--ink); border-radius: 2px; background: var(--bg); width: 100%; min-width: 0; }
.field textarea { min-height: 7rem; resize: vertical; line-height: 1.45; }
.field input:focus-visible, .field textarea:focus-visible { outline: 3px solid var(--amber); outline-offset: 0; background: var(--surface); }
.field input::placeholder, .field textarea::placeholder { color: var(--muted); opacity: 0.8; }
.who { max-width: 24rem; }
.send-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0.6rem 1rem; }
.counter { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.counter.over { color: var(--err); }
.btn { font: inherit; border: 1px solid var(--blue); background: var(--blue); color: #FFFFFF; font-weight: 600; font-size: 1.0625rem; padding: 0.6rem 1.2rem; border-radius: 2px; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--navy); border-color: var(--navy); }
.btn[disabled] { opacity: 0.55; cursor: default; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
#flash { font-size: 0.9375rem; color: var(--muted); min-height: 1.4em; }
#flash.err { color: var(--err); font-weight: 500; }
#flash.ok { color: var(--ink); font-weight: 500; }

/* ---- the live list ---- */
.qa { display: flex; flex-direction: column; gap: 1rem; }
.sec-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 0.25rem 1.5rem; padding-top: 0.7rem; border-top: 2px solid var(--ink); }
h2.title { font-family: var(--display); font-weight: 700; font-size: 1.625rem; line-height: 1.15; letter-spacing: -0.01em; }
.live { display: inline-flex; align-items: center; gap: 0.5rem; font-family: var(--mono); font-size: 0.8125rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.live .dot { width: 0.55rem; height: 0.55rem; border-radius: 50%; background: var(--amber); }
.live.off .dot { background: var(--line); }
.empty { padding: 1.25rem 0; color: var(--muted); }
.empty strong { display: block; color: var(--ink); font-family: var(--display); font-size: 1.125rem; font-weight: 700; margin-bottom: 0.25rem; }
.list { list-style: none; padding: 0; }
.q { display: grid; grid-template-columns: 3.5rem minmax(0, 1fr); gap: 0.25rem 1rem; padding: 0.95rem 0.75rem; border-top: 1px solid var(--line); }
.q:first-child { border-top: 0; }
.q.mine { background: var(--tint); border-top-color: transparent; }
.q.mine + .q { border-top-color: transparent; }
.q .at { font-family: var(--mono); font-weight: 500; font-size: 0.9375rem; font-variant-numeric: tabular-nums; padding-top: 0.1rem; }
.q .body { min-width: 0; display: flex; flex-direction: column; gap: 0.35rem; }
.q .who-line { display: flex; flex-wrap: wrap; align-items: center; gap: 0.35rem 0.6rem; }
.q .name { font-weight: 600; overflow-wrap: anywhere; }
.q .text { font-size: 1.125rem; line-height: 1.45; white-space: pre-wrap; overflow-wrap: anywhere; }
.q.answered .text, .q.answered .name, .q.answered .at { color: var(--muted); }
.chip { display: inline-block; font-family: var(--mono); font-size: 0.75rem; padding: 0.05rem 0.5rem; border-radius: 2px; border: 1px solid var(--line); color: var(--muted); }
.chip.solid { background: var(--blue); border-color: var(--blue); color: #FFFFFF; }
.link { font: inherit; border: 0; background: none; padding: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: 0.8125rem; }
.link:hover { color: var(--ink); }
.link.danger { color: var(--err); font-weight: 600; }
.foot { padding-top: 0.75rem; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0.25rem 1.5rem; }

@media (max-width: 520px) {
  .q { grid-template-columns: 2.9rem minmax(0, 1fr); gap: 0.25rem 0.7rem; }
}
@media (prefers-reduced-motion: no-preference) {
  .btn { transition: background-color 120ms ease, border-color 120ms ease; }
  .mark .ch.pop { animation: pop 240ms cubic-bezier(0.2, 0.9, 0.3, 1.4); }
  .q.fresh { animation: fresh 2.6s ease-out; }
  .live:not(.off) .dot { animation: blink 2s ease-in-out infinite; }
  .ask.shake { animation: shake 380ms ease; }
}
@keyframes pop { from { transform: translateY(0.14em); } }
@keyframes fresh { 0% { background-color: rgba(240, 162, 2, 0.45); transform: translateY(-6px); } 15% { transform: none; } 100% { background-color: transparent; } }
@keyframes blink { 50% { opacity: 0.25; } }
@keyframes shake { 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
</style>
</head>
<body>
<main class="wrap">
  <div class="topline label">
    <span>AI in Social Sciences Lab · Bocconi University</span>
    <span>Live questions</span>
  </div>

  <header class="hero">
    <h1 class="mark"><span class="w b">AISS</span> <span class="w">Bytes</span></h1>
    <p class="tagline"><strong>Ask the speaker.</strong> Your question appears below for everyone in the room.</p>
  </header>

  <form id="ask" class="ask" novalidate>
    <h2>Your question</h2>
    <label class="field who"><span class="label">Your name</span>
      <input id="name" type="text" maxlength="80" autocomplete="name" placeholder="First and last name">
    </label>
    <label class="field"><span class="label">Question</span>
      <textarea id="question" maxlength="500" placeholder="Type your question for the speaker"></textarea>
    </label>
    <div class="send-row">
      <span id="counter" class="counter">0 / 500</span>
      <button id="send" class="btn" type="submit">Send question</button>
    </div>
    <div id="flash" role="status" aria-live="polite"></div>
  </form>

  <section class="qa" aria-labelledby="qaTitle">
    <div class="sec-head">
      <h2 id="qaTitle" class="title">Today's questions</h2>
      <span id="live" class="live off"><span class="dot" aria-hidden="true"></span><span id="liveText">Connecting</span></span>
    </div>
    <p id="empty" class="empty"><strong>Loading questions</strong>Questions sent today will appear here, newest first.</p>
    <ol id="list" class="list" aria-live="polite"></ol>
  </section>

  <p class="foot label"><span id="today"></span><span id="contact"></span></p>
</main>

<script>
(function () {
  "use strict";
  var MAX = 500;
  var S = { questions: [], loaded: false, failed: false, busy: false, seen: null, armed: null, armTimer: 0 };
  var $ = function (id) { return document.getElementById(id); };

  function h(tag, attrs) {
    var el = document.createElement(tag), i, k;
    if (attrs) for (k in attrs) {
      if (k === "class") el.className = attrs[k];
      else if (k === "text") el.textContent = attrs[k];
      else if (k === "onclick") el.addEventListener("click", attrs[k]);
      else if (attrs[k] !== false && attrs[k] != null) el.setAttribute(k, attrs[k] === true ? "" : attrs[k]);
    }
    for (i = 2; i < arguments.length; i++) if (arguments[i]) el.appendChild(arguments[i]);
    return el;
  }

  /* ---- this browser's memory: your name, and a private key that lets
          only this browser delete the questions it sent ---- */
  function remember(k, v) { try { localStorage.setItem("aiss-qa-" + k, v); } catch (e) {} }
  function recall(k) { try { return localStorage.getItem("aiss-qa-" + k) || ""; } catch (e) { return ""; } }
  function newKey() {
    var a = new Uint8Array(16), s = "", i;
    (window.crypto || window.msCrypto).getRandomValues(a);
    for (i = 0; i < a.length; i++) s += (a[i] < 16 ? "0" : "") + a[i].toString(16);
    return s;
  }
  var KEY = recall("key");
  if (!/^[a-f0-9]{32}$/.test(KEY)) { KEY = newKey(); remember("key", KEY); }

  function flash(msg, kind) { var f = $("flash"); f.textContent = msg || ""; f.className = kind || ""; }
  var ERRORS = {
    name_required: "Type your name first.",
    question_required: "Type a question first.",
    too_fast: "Wait a few seconds before sending another question.",
    busy: "Lots of questions at once. Try again in a few seconds.",
    not_found: "That question was already removed."
  };

  /* ---- talking to the Google Sheet ---- */
  function readJson(r) { if (!r.ok) throw new Error("http " + r.status); return r.json(); }
  function load() {
    return fetch(CONFIG.API_URL + "?key=" + KEY + "&t=" + Date.now(), { redirect: "follow" })
      .then(readJson).then(function (d) { apply(d.questions); S.failed = false; });
  }
  function send(body) {
    body.key = KEY;
    // Sent as plain text on purpose: Google Apps Script only accepts this kind of request from another site.
    return fetch(CONFIG.API_URL, { method: "POST", redirect: "follow", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) })
      .then(readJson).then(function (d) { if (d.questions) apply(d.questions); return d; });
  }
  function apply(list) { S.questions = list || []; S.loaded = true; }

  /* ---- drawing ---- */
  function draw() {
    var qs = S.questions.slice().sort(function (a, b) { return b.at - a.at; });   // newest first
    var empty = $("empty");
    empty.hidden = S.loaded && qs.length > 0;
    if (!CONFIG.API_URL) {
      empty.replaceChildren(h("strong", { text: "Questions aren't connected yet" }),
        document.createTextNode("The organizer still needs to paste the Google Sheet link into this page."));
    } else if (S.failed && !S.loaded) {
      empty.replaceChildren(h("strong", { text: "Couldn't load the questions" }),
        document.createTextNode("Check your connection. The page keeps trying."));
    } else if (S.loaded && !qs.length) {
      empty.replaceChildren(h("strong", { text: "No questions yet" }),
        document.createTextNode("Be the first to ask. Questions sent today appear here, newest first."));
    }

    var live = $("live");
    live.className = "live" + (S.loaded && !S.failed ? "" : " off");
    $("liveText").textContent = !S.loaded ? (S.failed ? "Offline" : "Connecting")
      : S.failed ? "Reconnecting" : qs.length + " question" + (qs.length === 1 ? "" : "s") + " · live";

    // Highlight questions that arrived since the last refresh (not the ones there on first load).
    var first = S.seen === null, seen = S.seen || {};
    var items = qs.map(function (q) {
      var fresh = !first && !seen[q.id];
      seen[q.id] = true;
      var del = null;
      if (q.mine) {
        var armed = S.armed === q.id;
        del = h("button", {
          class: "link" + (armed ? " danger" : ""), type: "button", text: armed ? "Confirm delete" : "Delete",
          onclick: function () { remove(q.id); }
        });
      }
      return h("li", { class: "q" + (q.mine ? " mine" : "") + (q.answered ? " answered" : "") + (fresh ? " fresh" : "") },
        h("span", { class: "at", text: q.time || "" }),
        h("div", { class: "body" },
          h("p", { class: "who-line" },
            h("span", { class: "name", text: q.name || "Someone" }),
            q.mine ? h("span", { class: "chip solid", text: "Yours" }) : null,
            q.answered ? h("span", { class: "chip", text: "Answered" }) : null,
            del),
          h("p", { class: "text", text: q.question })));
    });
    if (S.loaded) S.seen = seen;
    var list = $("list");
    list.replaceChildren.apply(list, items);
    $("send").disabled = S.busy;
    $("send").textContent = S.busy ? "Sending…" : "Send question";
  }

  /* ---- actions ---- */
  function count() {
    var n = $("question").value.length, c = $("counter");
    c.textContent = n + " / " + MAX;
    c.className = "counter" + (n >= MAX ? " over" : "");
  }
  $("question").addEventListener("input", count);
  $("name").addEventListener("change", function () { remember("name", $("name").value.trim()); });
  // Ctrl+Enter or Cmd+Enter sends from the question box.
  $("question").addEventListener("keydown", function (ev) {
    if (ev.key === "Enter" && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); $("ask").requestSubmit ? $("ask").requestSubmit() : $("send").click(); }
  });

  function nudge(fieldId, msg) {
    flash(msg, "err");
    var box = $("ask");
    box.classList.remove("shake"); void box.offsetWidth; box.classList.add("shake");
    $(fieldId).focus();
  }

  $("ask").addEventListener("submit", function (ev) {
    ev.preventDefault();
    if (S.busy) return;
    if (!CONFIG.API_URL) { flash("Questions aren't connected yet.", "err"); return; }
    var name = $("name").value.trim(), question = $("question").value.trim();
    if (!name) return nudge("name", ERRORS.name_required);
    if (!question) return nudge("question", ERRORS.question_required);
    remember("name", name);
    S.busy = true; flash(""); draw();
    send({ action: "ask", name: name, question: question }).then(function (d) {
      if (d.ok) { $("question").value = ""; count(); flash("Question sent. It's at the top of the list.", "ok"); }
      else flash(ERRORS[d.error] || "Couldn't send. Try again.", "err");
    }).catch(function () {
      flash("Couldn't reach the questions sheet. Check your connection and try again.", "err");
    }).then(function () { S.busy = false; draw(); });
  });

  // Two clicks instead of a browser confirm dialog.
  function remove(id) {
    clearTimeout(S.armTimer);
    if (S.armed !== id) { S.armed = id; S.armTimer = setTimeout(function () { S.armed = null; draw(); }, 5000); draw(); return; }
    S.armed = null;
    if (S.busy) return;
    S.busy = true; draw();
    send({ action: "delete", id: id }).then(function (d) {
      flash(d.ok ? "Question deleted." : (ERRORS[d.error] || "Couldn't delete. Try again."), d.ok ? "ok" : "err");
    }).catch(function () {
      flash("Couldn't reach the questions sheet. Check your connection and try again.", "err");
    }).then(function () { S.busy = false; draw(); });
  }

  /* ---- start ---- */
  $("name").value = recall("name") || (function () { try { return localStorage.getItem("seminar-signup-name") || ""; } catch (e) { return ""; } })();
  $("today").textContent = new Intl.DateTimeFormat("en-GB", { weekday: "long", day: "numeric", month: "long", year: "numeric" }).format(new Date());
  $("contact").textContent = CONFIG.CONTACT || "";
  count();
  draw();

  function refresh() {
    if (!CONFIG.API_URL || S.busy) return;
    load().catch(function () { S.failed = true; }).then(draw);
  }
  refresh();
  setInterval(function () { if (document.visibilityState === "visible") refresh(); }, Math.max(3, CONFIG.REFRESH_SECONDS) * 1000);
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") refresh(); });

  /* ---- movement: the name decodes from bits when the page opens ---- */
  (function () {
    var mark = document.querySelector(".mark");
    if (!mark || (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches)) return;
    var name = mark.textContent.replace(/\s+/g, " ").trim(), chars = [];
    mark.setAttribute("aria-label", name);
    [].forEach.call(mark.querySelectorAll(".w"), function (word) {
      var text = word.textContent;
      word.textContent = "";
      word.setAttribute("aria-hidden", "true");
      text.split("").forEach(function (c) { var el = h("span", { class: "ch", text: c }); el._c = c; word.appendChild(el); chars.push(el); });
    });
    function toBit(el, cls) {
      if (!el._locked) { el._w = el.getBoundingClientRect().width / parseFloat(getComputedStyle(mark).fontSize); el.style.width = el._w + "em"; el._locked = true; }
      el.textContent = el._w < 0.5 || Math.random() < 0.5 ? "1" : "0";
      el.className = "ch " + cls;
    }
    function toLetter(el) { el.textContent = el._c; el.style.width = ""; el._locked = false; el.className = "ch pop"; }
    var ready = false;
    function flip(el) {
      if (!ready || el._busy) return;
      el._busy = true;
      var n = 0;
      (function step() { toBit(el, "flip"); if (++n < 4) setTimeout(step, 90); else setTimeout(function () { toLetter(el); el._busy = false; }, 280); })();
    }
    function intro() {
      chars.forEach(function (el, i) {
        setTimeout(function tick() { if (el._done) return; toBit(el, "bit"); el._t = setTimeout(tick, 70); }, i * 45);
        setTimeout(function () { el._done = true; clearTimeout(el._t); toLetter(el); }, 560 + i * 95);
      });
      setTimeout(function () { ready = true; }, 560 + chars.length * 95 + 400);
    }
    mark.addEventListener("pointerover", function (ev) { if (ev.target._c) flip(ev.target); });
    var started = false;
    function start() { if (!started) { started = true; intro(); } }
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(start);
    setTimeout(start, 1500);
  })();
})();
</script>
</body>
</html>
